<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IN BOX</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>IN BOX</h1>
      <nav class="view-switch" aria-label="画面切り替え">
        <button id="show-inbox" class="active" type="button">入力</button>
        <button id="show-manage" type="button">詳細</button>
      </nav>
    </header>

    <section id="inbox-view" class="view">
      <h2>入力画面</h2>
      <h2 class="desc">思いついた言葉を追加してください。</h2>
      <form id="add-form" class="row">
        <input
          id="item-input"
          type="text"
          placeholder="例: 牛乳を買う"
          autocomplete="off"
          required
        />
        <button type="submit">追加</button>
      </form>
      <p id="add-message" class="message" aria-live="polite"></p>
    </section>

    <section id="manage-view" class="view hidden">
      <h2>詳細画面</h2>
      <h2 class="desc">項目をジャンル分けできます。</h2>
      <div class="manage-toolbar">
        <label for="sort-mode">並び順</label>
        <select id="sort-mode">
          <option value="newest">追加順</option>
          <option value="oldest">古い順</option>
          <option value="category">ジャンル毎</option>
        </select>
      </div>

      <ul id="items-list" class="items"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
