<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IN BOX</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>IN BOX</h1>
      <nav class="view-switch" aria-label="画面切り替え">
        <button id="show-inbox" class="active" type="button">入力</button>
        <button id="show-manage" type="button">分類</button>
      </nav>
    </header>

    <section id="inbox-view" class="view">
      <h2>入力画面</h2>
      <p class="desc">思いついた言葉を追加してください。</p>
      <form id="add-form" class="row">
        <input
          id="item-input"
          type="text"
          placeholder="例: 牛乳を買う"
          autocomplete="off"
          required
        />
        <button type="submit">追加</button>
      </form>
      <p id="add-message" class="message" aria-live="polite"></p>
    </section>

    <section id="manage-view" class="view hidden">
      <h2>分類画面</h2>
      <p class="desc">項目をジャンル分けできます。</p>

      <div class="category-box">
        <button id="toggle-category-form" class="category-toggle" type="button" aria-expanded="false">
          分類を追加
        </button>
        <form id="category-form" class="row hidden">
          <input
            id="category-input"
            type="text"
            placeholder="新しいジャンル名"
            autocomplete="off"
            required
          />
          <button type="submit">追加</button>
        </form>
      </div>

      <ul id="items-list" class="items"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
